name: Daily Swing Scanner & Telegram Alert

on:
  schedule:
    # Runs Monday to Friday at 12:30 UTC (6:00 PM IST)
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Mobile App

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Swing Scanner (50 DEMA & 200 EMA)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m engine.cli_scan

      - name: Commit Latest Scan Results for Streamlit App
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/latest_setups.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): update daily swing setups [skip ci]" && git push)
